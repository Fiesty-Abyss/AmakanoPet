[project]
name = "amakanopet"
version = "0.2.2"
description = "非官方同人桌宠：アマカノ（甜蜜女友）系列角色乐园。用户自备模型，不含任何官方素材。"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fiesty-Abyss" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]
live2d = ["live2d-py>=1.0; python_version >= '3.11'"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
