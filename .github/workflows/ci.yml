name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  live2d:
    # Renders a Live2D official free sample model (downloaded at test time, never committed).
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt / OpenGL runtime and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb \
            libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-image0 libxcb-render-util0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt -r requirements-live2d.txt
      - name: Fetch Live2D sample (Free Material License, test only)
        run: echo "AMAKANOPET_LIVE2D_SAMPLE=$(tools/fetch_live2d_sample.sh Mark "$RUNNER_TEMP/live2d" | tail -1)" >> "$GITHUB_ENV"
      - run: xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest -q -rs tests/test_live2d.py
      - name: Make sure the sample was not added to the repository
        run: test -z "$(git status --porcelain)"
